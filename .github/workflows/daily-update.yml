name: Daily automated date update

on:
  schedule:
    # Check daily at 00:00 UTC (05:00 Pakistan time).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-date-update
  cancel-in-progress: false

jobs:
  update-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Select five days for this UTC week
        id: schedule
        shell: python
        run: |
          import hashlib
          import os
          from datetime import datetime, timedelta, timezone

          today = datetime.now(timezone.utc).date()
          monday = today - timedelta(days=today.weekday())
          # Stable selection within a week; a new selection each Monday.
          # Hash ranking gives five distinct days without storing extra files.
          seed = f"{os.environ['GITHUB_REPOSITORY']}:{monday.isoformat()}"
          days = sorted(
              range(7),
              key=lambda day: hashlib.sha256(f"{seed}:{day}".encode()).digest(),
          )[:5]
          manual = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          run_today = manual or today.weekday() in days
          count_seed = f"{os.environ['GITHUB_REPOSITORY']}:{today}:heartbeat-count"
          count = 2 + hashlib.sha256(count_seed.encode()).digest()[0] % 2
          names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
          print('Selected UTC days: ' + ', '.join(names[day] for day in sorted(days)))
          print('Manual override.' if manual else ('Selected day.' if run_today else 'Rest day.'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"run_today={str(run_today).lower()}\n")
              output.write(f"count={count}\n")
              output.write(f"utc_date={today.isoformat()}\n")

      - name: Check out default branch
        if: steps.schedule.outputs.run_today == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Record two or three automated heartbeats
        if: steps.schedule.outputs.run_today == 'true'
        shell: bash
        env:
          UTC_DATE: ${{ steps.schedule.outputs.utc_date }}
          HEARTBEAT_COUNT: ${{ steps.schedule.outputs.count }}
        run: |
          set -euo pipefail
          git config user.name 'Muhammad Dayan Amjad'
          git config user.email '213164897+danii427@users.noreply.github.com'
          completed=0
          if [[ -f activity.txt ]] && [[ "$(head -n 1 activity.txt)" == "$UTC_DATE" ]]; then
            recorded=$(sed -n 's/^Automated heartbeat: \([0-3]\)\/[23]$/\1/p' activity.txt)
            completed=${recorded:-0}
          fi
          for ((i=completed+1; i<=HEARTBEAT_COUNT; i++)); do
            printf '%s\nAutomated heartbeat: %s/%s\n' "$UTC_DATE" "$i" "$HEARTBEAT_COUNT" > activity.txt
            git add -- activity.txt
            if git diff --cached --quiet -- activity.txt; then
              continue
            fi
            git commit -m "chore: automated heartbeat $i/$HEARTBEAT_COUNT ($UTC_DATE)" -- activity.txt
          done
          git push origin HEAD
